<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- On-brand favicon replacing the generic scaffold default: a simple
       monochrome rubber-stamp/mail glyph in the app's `stamp` accent color
       (#274690), fitting the postal/tracking-manifest identity used
       throughout the board (see tailwind.config.js's color comments). -->
  <rect x="3" y="3" width="42" height="42" rx="6" fill="#274690" />
  <!-- Envelope outline -->
  <path d="M10 15h28a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2Z"
        fill="none" stroke="#F1F3F2" stroke-width="2.4" stroke-linejoin="round" />
  <!-- Envelope flap -->
  <path d="M9 16.5 24 27l15-10.5" fill="none" stroke="#F1F3F2" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- Tracking checkmark, echoing the app's "manifest checked off" motif -->
  <path d="M18.5 33.5 22 37l8-9" fill="none" stroke="#F1F3F2" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
