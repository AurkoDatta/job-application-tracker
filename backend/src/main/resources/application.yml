spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/jobtracker}
      # Spring Data MongoDB disables automatic index creation by default
      # (since Spring Boot 2.4 / Spring Data MongoDB 3.x) — without this,
      # @Indexed(unique = true) on User.email is inert and duplicate emails
      # would only be rejected by the racy application-level check.
      auto-index-creation: true

server:
  port: 8080

jwt:
  # Local-dev-only placeholder (32+ chars so HS256/HS512 key-length validation
  # doesn't fail at startup) — not a real secret, same pattern as the Mongo
  # URI default above. Override via JWT_SECRET in any real deployment.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

cookie:
  secure: ${COOKIE_SECURE:false}   # false for local http dev; must be true in any real deployment over https

cors:
  # Wildcard-localhost-port pattern, safe only because it stays scoped to
  # localhost (see CorsConfig's class-level comment for the full rationale).
  # Default here is what every documented local-dev setup in the README
  # relies on; override via CORS_ALLOWED_ORIGIN_PATTERN for any real
  # deployment so this pattern doesn't silently follow the app there.
  allowed-origin-pattern: ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:[*]}

logging:
  level:
    # Default INFO for normal operation (business-event logs from the
    # service layer + WARN/ERROR from GlobalExceptionHandler). Override per
    # environment via the LOGGING_LEVEL_COM_JOBTRACKER env var (Spring
    # Boot's standard relaxed-binding convention for logging.level.* —
    # e.g. LOGGING_LEVEL_COM_JOBTRACKER=DEBUG to also see JwtAuthFilter's
    # stale-token debug line and StatsController's per-request debug line).
    com.jobtracker: ${LOGGING_LEVEL_COM_JOBTRACKER:INFO}
