# Example local configuration for onboarding — copy the relevant env vars
# into your shell/.env, do not commit real secrets. application.yml already
# falls back to these same local-safe defaults when the env vars are unset.
spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/jobtracker
      auto-index-creation: true

server:
  port: 8080

jwt:
  secret: replace-with-a-long-random-secret-at-least-32-characters
  expiration-ms: 86400000   # 24h

cookie:
  secure: false   # set to true when serving the frontend over https
